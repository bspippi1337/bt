<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BT Toolkit</title><style>body{font:16px system-ui;background:#080b0e;color:#eee;max-width:1000px;margin:auto;padding:20px}h1{font-size:64px;color:#ffd84a;margin:0}section{background:#10161c;border:1px solid #294052;border-radius:15px;padding:16px;margin:14px 0}button,textarea{font:inherit;background:#0a1117;color:#fff;border:1px solid #3c607a;border-radius:9px;padding:11px}textarea{width:100%;min-height:160px;box-sizing:border-box}pre{white-space:pre-wrap;word-break:break-word;background:#05080b;padding:12px;border-radius:9px}.row{display:flex;gap:8px;flex-wrap:wrap}</style><h1>BT</h1><p>Browser Bluetooth scanner, GATT mapper og «parse ALL the config».</p><section><h2>Bluetooth</h2><div class="row"><button id="scan">Søk Bluetooth</button><button id="disc">Koble fra</button></div><pre id="gatt">Ikke tilkoblet.</pre></section><section><h2>Parse ALL the config</h2><textarea id="src" placeholder="hex, base64, JSON, XML, key=value, UUID, escaped bytes, rå tekst..."></textarea><p><button id="parse">Analyser + oversett</button></p><pre id="out">Venter på input.</pre></section><script>const $=x=>document.getElementById(x),enc=new TextEncoder(),dec=new TextDecoder();let d;function hx(u){return[...u].map(x=>x.toString(16).padStart(2,'0')).join(' ')}function b64(u){let s='';for(const x of u)s+=String.fromCharCode(x);return btoa(s)}function fromHex(s){let h=s.replace(/0x/gi,'').replace(/[^0-9a-f]/gi,'');if(h.length%2)throw Error('odd hex');return Uint8Array.from(h.match(/../g)||[],x=>parseInt(x,16))}function from64(s){let x=atob(s.replace(/\s/g,''));return Uint8Array.from(x,c=>c.charCodeAt(0))}scan.onclick=async()=>{try{if(!navigator.bluetooth)throw Error('Web Bluetooth ikke støttet');d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['battery_service','device_information','generic_access','generic_attribute','6e400001-b5a3-f393-e0a9-e50e24dcca9e']});let s=await d.gatt.connect(),ss=await s.getPrimaryServices(),a=[`DEVICE ${d.name||d.id}`];for(const x of ss){a.push(`SERVICE ${x.uuid}`);try{for(const c of await x.getCharacteristics()){let p=['read','write','writeWithoutResponse','notify','indicate'].filter(k=>c.properties[k]);a.push(`  ${c.uuid} [${p.join(', ')}]`);if(c.properties.read)try{let v=await c.readValue(),u=new Uint8Array(v.buffer,v.byteOffset,v.byteLength);a.push(`    ${hx(u)} | ${JSON.stringify(dec.decode(u))}`)}catch{}}}catch{}}gatt.textContent=a.join('\n')}catch(e){gatt.textContent='Feil/avbrutt: '+e}};disc.onclick=()=>d?.gatt?.disconnect();parse.onclick=()=>{let s=src.value.trim(),type='TEXT',u;try{if(/^\s*[\[{]/.test(s)){JSON.parse(s);type='JSON'}}catch{}let h=s.replace(/0x/gi,'').replace(/[^0-9a-f]/gi,'');if(h.length>=4&&h.length%2===0&&h.length/Math.max(1,s.replace(/\s/g,'').length)>.65){try{u=fromHex(s);type='HEX'}catch{}}if(!u&&/^[A-Za-z0-9+/_=-]{8,}$/.test(s.replace(/\s/g,''))){try{u=from64(s);type='BASE64'}catch{}}if(!u)u=enc.encode(s);let uu=[...s.matchAll(/\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b/gi)].map(x=>x[0]);let clues=[];if(/6e400001/i.test(s))clues.push('Nordic UART Service');if(/6e400002/i.test(s))clues.push('NUS RX/write');if(/6e400003/i.test(s))clues.push('NUS TX/notify');if(/M0?ROBOT|MOROBOT/i.test(s))clues.push('MOROBOT');if(/XBOT/i.test(s))clues.push('XBOT');out.textContent=`BEST GUESS: ${type}\nBYTES: ${u.length}\nCLUES: ${clues.join(', ')||'none'}\nUUID: ${uu.join(', ')||'none'}\n\nUTF-8:\n${dec.decode(u)}\n\nHEX:\n${hx(u)}\n\nBASE64:\n${b64(u)}\n\nBYTES:\n[${[...u].join(', ')}]\n\nESCAPED:\n${[...u].map(b=>b>=32&&b<127?String.fromCharCode(b):'\\x'+b.toString(16).padStart(2,'0')).join('')}`}</script>
